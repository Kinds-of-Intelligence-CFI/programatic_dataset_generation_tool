[project]
name = "programatic-dataset-generation-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tqdm>=4.66",
]

[project.optional-dependencies]
viewer = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
viewer = "viewer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.13",
    "types-tqdm>=4.66",
    "pillow>=10.0",
    "httpx>=0.27",
]
inspect = [
    "inspect-ai>=0.3.214",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataset", "generation", "evaluation", "viewer"]

[tool.hatch.build.targets.wheel.force-include]
"viewer/static" = "viewer/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
